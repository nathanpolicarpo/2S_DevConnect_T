<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevConnect - Cadastro</title>
  <link rel="stylesheet" href="logincss.css">
</head>
<body>
  <main>
    <div class="mainDiv">
      <form class="formulario">
        <h1 class="logo">DevConnect</h1>
        <p>Cadastre-se para comunidade exclusiva de desenvolvedores(as).</p>

        <div class="formularioDiv">
          <input class="estilo-formulario" type="text" placeholder="Nome e sobrenome" required>
          <input class="estilo-formulario" type="text" placeholder="Nome de usuário" required>
          <input class="estilo-formulario" type="email" placeholder="E-mail" required>
          <input class="estilo-formulario" type="password" placeholder="Senha" required>
          <input class="estilo-formulario" type="file" accept="image/*">
        </div>

        <button class="formulario-botao-azul" type="submit">Cadastrar-se</button>

        <p class="info-aplicativo">
          Ao se cadastrar, você concorda com nossos<br>
          Termos, Política de Dados e Política de Cookies.
        </p>
      </form>

      <div class="secao-cadastro">
        <p>Tem uma conta? <a href="#">Conecte-se</a></p>
      </div>
    </div>
  </main>
</body>
</html>
